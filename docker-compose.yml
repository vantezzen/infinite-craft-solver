version: "3.6"

services:
  app:
    build:
      context: .
      args:
        - POSTGRES_DATABASE
        - POSTGRES_HOST
        - POSTGRES_PASSWORD
        - POSTGRES_PRISMA_URL
        - POSTGRES_URL
        - POSTGRES_URL_NO_SSL
        - POSTGRES_URL_NON_POOLING
        - POSTGRES_USER
        - PUPPETEER_SKIP_DOWNLOAD=true
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - POSTGRES_DATABASE
      - POSTGRES_HOST
      - POSTGRES_PASSWORD
      - POSTGRES_PRISMA_URL
      - POSTGRES_URL
      - POSTGRES_URL_NO_SSL
      - POSTGRES_URL_NON_POOLING
      - POSTGRES_USER
      - PUPPETEER_SKIP_DOWNLOAD=true
